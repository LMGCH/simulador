<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Observability Labs</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body{
            background:#11131c;
            color:#dfe5ef;
            font-family:Inter,system-ui,sans-serif;
            overflow:hidden;
        }

        ::-webkit-scrollbar{
            width:7px;
        }

        ::-webkit-scrollbar-thumb{
            background:#34384b;
            border-radius:10px;
        }

        ::-webkit-scrollbar-track{
            background:#161922;
        }

        .card{
            background:#1b1f2b;
            border:1px solid #2f3445;
            border-radius:10px;
        }

        .menu-item{
            transition:.25s;
        }

        .menu-item:hover{
            background:#232839;
            color:white;
        }

        .active-menu{
            background:#006DE4;
            color:white;
        }

        .logo{
            background:#006DE4;
        }

        .status-online{
            width:10px;
            height:10px;
            border-radius:50%;
            background:#00d084;
            box-shadow:0 0 10px #00d084;
        }

        .placeholder{
            background:
                repeating-linear-gradient(
                    -45deg,
                    #242838,
                    #242838 12px,
                    #2d3344 12px,
                    #2d3344 24px
                );
        }
    </style>

</head>

<body>

<div class="flex h-screen">

    <!-- SIDEBAR -->

    <aside class="w-72 bg-[#171a24] border-r border-[#2f3445] flex flex-col">

        <!-- Logo -->

        <div class="p-6 border-b border-[#2f3445]">

            <div class="flex items-center gap-4">

                <div class="logo w-12 h-12 rounded-lg flex items-center justify-center font-bold text-xl">
                    O
                </div>

                <div>

                    <h1 class="font-bold text-lg">
                        Observability
                    </h1>

                    <p class="text-xs text-gray-400">
                        Enterprise Dashboard
                    </p>

                </div>

            </div>

        </div>

        <!-- MENU -->

        <nav class="flex-1 mt-4 space-y-2 px-3">

            <div class="menu-item active-menu rounded-lg px-4 py-3 flex items-center gap-3 cursor-pointer">

                <i class="fa-solid fa-chart-line w-5"></i>

                Dashboard

            </div>

            <div class="menu-item rounded-lg px-4 py-3 flex items-center gap-3 cursor-pointer">

                <i class="fa-solid fa-heart-pulse w-5"></i>

                APM

            </div>

            <div class="menu-item rounded-lg px-4 py-3 flex items-center gap-3 cursor-pointer">

                <i class="fa-solid fa-server w-5"></i>

                Infrastructure

            </div>

            <div class="menu-item rounded-lg px-4 py-3 flex items-center gap-3 cursor-pointer">

                <i class="fa-solid fa-network-wired w-5"></i>

                Services

            </div>

            <div class="menu-item rounded-lg px-4 py-3 flex items-center gap-3 cursor-pointer">

                <i class="fa-solid fa-file-lines w-5"></i>

                Logs

            </div>

            <div class="menu-item rounded-lg px-4 py-3 flex items-center gap-3 cursor-pointer">

                <i class="fa-solid fa-bell w-5"></i>

                Alerts

            </div>

            <div class="menu-item rounded-lg px-4 py-3 flex items-center gap-3 cursor-pointer">

                <i class="fa-solid fa-gear w-5"></i>

                Settings

            </div>

        </nav>

        <!-- FOOTER -->

        <div class="border-t border-[#2f3445] p-5">

            <div class="flex justify-between items-center">

                <div>

                    <div class="text-sm font-semibold">
                        Cluster
                    </div>

                    <div class="text-xs text-gray-400">
                        observability-prod
                    </div>

                </div>

                <div class="status-online"></div>

            </div>

        </div>

    </aside>

    <!-- MAIN -->

    <main class="flex-1 flex flex-col">

        <!-- TOPBAR -->

        <header class="h-20 border-b border-[#2f3445] px-8 flex items-center justify-between">

            <div>

                <h2 class="text-2xl font-bold">

                    Dashboard

                </h2>

                <div class="text-sm text-gray-400">

                    Monitorización de servicios corporativos

                </div>

            </div>

            <div class="flex items-center gap-4">

                <!-- KQL -->

                <div class="bg-[#1d2130] border border-[#2f3445] rounded-lg px-4 py-2 flex items-center gap-3 w-[520px]">

                    <i class="fa-solid fa-magnifying-glass text-gray-500"></i>

                    <span class="text-sm text-blue-400 font-mono">

                        service.name : "gateway"

                    </span>

                </div>

                <button class="bg-[#006DE4] hover:bg-blue-600 px-5 py-2 rounded-lg">

                    Últimos 15 min

                </button>

            </div>

        </header>

        <!-- CONTENT -->

        <section class="flex-1 overflow-auto p-8">

            <!-- KPI DASHBOARD -->

<div id="kpi-grid"
class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 mb-8">

</div>

            <!-- GRAPH -->

            <div class="card h-96 mb-8 placeholder"></div>

            <!-- LOWER -->

            <div class="grid grid-cols-3 gap-6">

                <div class="card h-96 placeholder"></div>

                <div class="card h-96 placeholder"></div>

                <div class="card h-96 placeholder"></div>

            </div>

        </section>

    </main>

</div>
<script>

const metrics = [

{
title:"Latencia",
unit:"ms",
icon:"fa-gauge-high",
color:"#22c55e",
min:90,
max:180,
decimals:0,
trend:-1
},

{
title:"Throughput",
unit:"req/min",
icon:"fa-arrow-trend-up",
color:"#3b82f6",
min:1200,
max:1700,
decimals:0,
trend:1
},

{
title:"Error Rate",
unit:"%",
icon:"fa-circle-exclamation",
color:"#ef4444",
min:0.01,
max:0.35,
decimals:2,
trend:-1
},

{
title:"CPU",
unit:"%",
icon:"fa-microchip",
color:"#f59e0b",
min:15,
max:75,
decimals:0,
trend:1
},

{
title:"Memory",
unit:"%",
icon:"fa-memory",
color:"#8b5cf6",
min:30,
max:88,
decimals:0,
trend:1
},

{
title:"Active Services",
unit:"",
icon:"fa-server",
color:"#06b6d4",
min:8,
max:14,
decimals:0,
trend:0
}

];

const grid=document.getElementById("kpi-grid");

metrics.forEach((m,index)=>{

const card=document.createElement("div");

card.className="card p-6";

card.innerHTML=`

<div class="flex justify-between items-center">

<div>

<div class="text-xs uppercase tracking-widest text-gray-400">

${m.title}

</div>

<div
id="metric${index}"
class="text-4xl font-bold mt-3">

--

</div>

<div
id="trend${index}"
class="text-xs mt-3">

</div>

</div>

<div
class="w-14 h-14 rounded-xl flex items-center justify-center text-2xl"
style="background:${m.color}22;color:${m.color}">

<i class="fa-solid ${m.icon}"></i>

</div>

</div>

`;

grid.appendChild(card);

});

// -----------------------------
// Estado del sistema
// -----------------------------

const system = {

    users: 340,

    throughput: 1450,

    cpu: 38,

    memory: 54,

    latency: 118,

    errorRate: 0.05,

    services: 12

};

// -----------------------------
// Motor de simulación
// -----------------------------

function simulateSystem(){

    // Variación de usuarios

    system.users += Math.floor(Math.random()*41)-20;
    system.users = Math.max(100, Math.min(1200, system.users));

    // Throughput

    system.throughput = Math.round(
        800 + system.users * 2.2
    );

    // CPU

    system.cpu =
        18 +
        system.throughput / 55 +
        (Math.random()*5-2);

    system.cpu = Math.min(100, system.cpu);

    // Memoria

    system.memory =
        30 +
        system.cpu * 0.65 +
        (Math.random()*4-2);

    system.memory = Math.min(95, system.memory);

    // Latencia

    system.latency =
        70 +
        system.cpu * 1.25 +
        Math.random()*10;

    // Error Rate

    system.errorRate =
        0.02 +
        Math.max(0,(system.cpu-65))*0.015;

}

function updateMetrics(){

    // Actualiza el estado del sistema
    simulateSystem();

    // Valores reales procedentes del motor
    const values = [

        system.latency,
        system.throughput,
        system.errorRate,
        system.cpu,
        system.memory,
        system.services

    ];

    metrics.forEach((m,index)=>{

        let value = values[index];

        if(m.decimals > 0){

            value = Number(value).toFixed(m.decimals);

        }else{

            value = Math.round(value);

        }

        document.getElementById("metric"+index).innerHTML =

            value +
            " <span class='text-lg text-gray-400'>" +
            m.unit +
            "</span>";

        const trend = document.getElementById("trend"+index);

        switch(index){

            // Latencia
            case 0:

                if(system.latency < 120){

                    trend.innerHTML =
                    "<span class='text-green-400'><i class='fa-solid fa-check'></i> Excelente</span>";

                }else if(system.latency < 170){

                    trend.innerHTML =
                    "<span class='text-yellow-400'><i class='fa-solid fa-triangle-exclamation'></i> Normal</span>";

                }else{

                    trend.innerHTML =
                    "<span class='text-red-400'><i class='fa-solid fa-circle-exclamation'></i> Alta</span>";

                }

            break;

            // Throughput
            case 1:

                trend.innerHTML =
                "<span class='text-blue-400'>" +
                system.users +
                " usuarios conectados</span>";

            break;

            // Error Rate
            case 2:

                if(system.errorRate < 0.10){

                    trend.innerHTML =
                    "<span class='text-green-400'>Sin incidencias</span>";

                }else if(system.errorRate < 0.30){

                    trend.innerHTML =
                    "<span class='text-yellow-400'>Advertencias</span>";

                }else{

                    trend.innerHTML =
                    "<span class='text-red-500'>Errores críticos</span>";

                }

            break;

            // CPU
            case 3:

                trend.innerHTML =
                "<span class='text-orange-400'>Carga del sistema</span>";
            break;

            // Memoria
            case 4:

                trend.innerHTML =
                "<span class='text-purple-400'>Uso de memoria</span>";

            break;

            // Servicios
            case 5:

                trend.innerHTML =
                "<span class='text-cyan-400'>Todos operativos</span>";

            break;

        }

    });

}

updateMetrics();

setInterval(updateMetrics,2000);

</script>
</body>

</html>
